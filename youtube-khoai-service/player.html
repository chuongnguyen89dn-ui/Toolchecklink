<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Khoai Player</title><style>body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system}main{max-width:960px;margin:auto;padding:16px}video{width:100%;background:#000;max-height:75vh}button,select{font-size:16px;padding:10px;margin:8px 6px 8px 0}</style></head><body><main><h3>Khoai Lang Thang - Direct Player</h3><video id="v" controls playsinline preload="metadata" poster="https://i.ytimg.com/vi/B1qT38bVsXc/maxresdefault.jpg"></video><div><select id="q"><option value="2160">4K</option><option value="1440" selected>2K / 1440p</option><option value="1080">1080p</option><option value="720">720p</option></select><button id="go">Phát</button></div><div id="status">Video đầu tiên - mặc định 2K</div></main><script>const id="B1qT38bVsXc",v=document.getElementById("v"),q=document.getElementById("q"),st=document.getElementById("status");document.getElementById("go").onclick=function(){st.textContent="Đang mở "+q.value+"p";v.src="/play/"+id+"/"+q.value+".mp4";v.play().catch(function(){});};v.onplaying=function(){st.textContent="Đang phát "+q.value+"p";};v.onerror=function(){st.textContent="Không phát được mức "+q.value+"p";};</script></body></html>
