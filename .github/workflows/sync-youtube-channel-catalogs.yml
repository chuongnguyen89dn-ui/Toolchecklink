name: Sync YouTube channel catalogs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '.github/workflows/sync-youtube-channel-catalogs.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - name: Scan channels and update central JSON
        run: |
          python - <<'PY'
          import json,subprocess,datetime,pathlib
          p=pathlib.Path('youtube-khoai-service/channels-catalog.json')
          data=json.loads(p.read_text())
          for key in ('hoaban','bombom','sang'):
              c=data['channels'][key]
              url='https://www.youtube.com/'+c['handle']+'/videos'
              try:
                  output=subprocess.check_output(['yt-dlp','--flat-playlist','--dump-single-json','--ignore-errors','--no-warnings',url],timeout=240,text=True)
                  entries=json.loads(output).get('entries',[])
                  seen=set(); videos=[]
                  for v in entries:
                      if not v or not v.get('id') or v['id'] in seen: continue
                      seen.add(v['id']); vid=v['id']
                      videos.append({'videoId':vid,'title':v.get('title') or vid,'url':'https://www.youtube.com/watch?v='+vid,'duration':v.get('duration'),'thumbnail':v.get('thumbnail') or 'https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg','channel':c['name'],'posterShape':'landscape'})
                  if videos:
                      c['videos']=videos
                      print(key,len(videos))
                  else: print(key,'scan empty, retained',len(c['videos']))
              except Exception as exc: print(key,'scan failed, retained',len(c['videos']),str(exc)[:250])
          data['updatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit refreshed catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-khoai-service/channels-catalog.json
          git diff --cached --quiet || (git commit -m 'Sync channel video catalogs' && git push)
