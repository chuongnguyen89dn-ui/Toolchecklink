name: Build Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'toolchecklink.py'
      - 'toolchecklink_gui.py'
      - 'engines/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\pw-browsers
    steps:
      - name: Download build sources only
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          Invoke-WebRequest "$base/toolchecklink.py" -OutFile toolchecklink.py
          Invoke-WebRequest "$base/toolchecklink_gui.py" -OutFile toolchecklink_gui.py
          Invoke-WebRequest "$base/requirements.txt" -OutFile requirements.txt
          New-Item -ItemType Directory -Force engines | Out-Null
          @("README.md","__init__.py","external_resolvers.py","hls_inspector.py","report_contract.py") | ForEach-Object {
            Invoke-WebRequest "$base/engines/$_" -OutFile "engines/$_"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install dedicated Chromium
        run: python -m playwright install chromium
      - name: Verify dedicated Chromium
        shell: pwsh
        run: |
          $chrome = Get-ChildItem "$env:PLAYWRIGHT_BROWSERS_PATH" -Recurse -Filter chrome.exe | Select-Object -First 1
          if (!$chrome) { throw "Dedicated Chromium missing" }
      - name: Build GUI EXE
        run: pyinstaller --noconfirm --onefile --windowed --collect-all playwright --name Toolchecklink toolchecklink_gui.py
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item .\dist\Toolchecklink.exe .\portable\
          Copy-Item "$env:PLAYWRIGHT_BROWSERS_PATH" .\portable\pw-browsers -Recurse
          if (!(Test-Path .\portable\Toolchecklink.exe)) { throw "EXE missing" }
          $chrome = Get-ChildItem .\portable\pw-browsers -Recurse -Filter chrome.exe | Select-Object -First 1
          if (!$chrome) { throw "Portable Chromium missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: Toolchecklink-Windows-Portable-Chromium
          path: portable/
