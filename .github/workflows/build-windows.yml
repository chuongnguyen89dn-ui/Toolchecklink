name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install Chromium fallback
        run: python -m playwright install chromium
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install resolver CLIs
        run: pip install yt-dlp streamlink
      - name: Source smoke test
        run: |
          python toolchecklink.py --help
          ffprobe -version
          yt-dlp --version
          streamlink --version
      - name: Build integrated EXE
        run: pyinstaller --noconfirm --onefile --collect-all playwright --name Toolchecklink toolchecklink.py
      - name: Packaged EXE smoke test
        shell: pwsh
        run: |
          .\dist\Toolchecklink.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Toolchecklink-Windows
          path: dist/Toolchecklink.exe
