name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install Toolchecklink Chromium
        run: python -m playwright install chromium
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install resolver CLIs
        run: pip install yt-dlp streamlink
      - name: Source smoke test
        run: |
          python toolchecklink.py --help
          python -m py_compile toolchecklink_gui.py
          ffprobe -version
          yt-dlp --version
          streamlink --version
      - name: Build GUI EXE
        run: pyinstaller --noconfirm --onefile --windowed --collect-all playwright --name Toolchecklink toolchecklink_gui.py
      - name: Verify packaged EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path .\dist\Toolchecklink.exe)) { exit 1 }
          $size=(Get-Item .\dist\Toolchecklink.exe).Length
          if ($size -lt 1000000) { exit 1 }
          Write-Host "GUI EXE bytes: $size"
      - uses: actions/upload-artifact@v4
        with:
          name: Toolchecklink-Windows-GUI-Chromium
          path: dist/Toolchecklink.exe
