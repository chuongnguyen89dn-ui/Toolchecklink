name: Scan Khoai Lang Thang YouTube
# trigger initial scan
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scan-khoai-youtube.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Scan Videos tab only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p youtube-khoai
          yt-dlp --flat-playlist --dump-single-json "https://www.youtube.com/@KhoaiLangThang/videos" > youtube-khoai/raw.json
          python - <<'PY'
          import json, csv, pathlib
          p=pathlib.Path("youtube-khoai/raw.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          rows=[]
          seen=set()
          for e in d.get("entries") or []:
              vid=e.get("id")
              if not vid or vid in seen: continue
              seen.add(vid)
              rows.append({
                  "videoId":vid,
                  "title":e.get("title"),
                  "url":f"https://www.youtube.com/watch?v={vid}",
                  "duration":e.get("duration"),
                  "thumbnail":e.get("thumbnail"),
                  "uploadDate":e.get("upload_date"),
                  "channel":e.get("channel") or d.get("channel") or "Khoai Lang Thang / Food & Travel"
              })
          pathlib.Path("youtube-khoai/catalog.json").write_text(
              json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          with open("youtube-khoai/catalog.csv","w",newline="",encoding="utf-8-sig") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()) if rows else ["videoId","title","url","duration","thumbnail","uploadDate","channel"])
              w.writeheader(); w.writerows(rows)
          print("CATALOG_COUNT="+str(len(rows)))
          PY
          rm youtube-khoai/raw.json
      - name: Enrich metadata and max resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys, time
          p=pathlib.Path("youtube-khoai/catalog.json")
          rows=json.loads(p.read_text(encoding="utf-8"))
          for i,r in enumerate(rows,1):
              vid=r["videoId"]
              cmd=["yt-dlp","--skip-download","--no-playlist","--dump-single-json",
                   "--extractor-args","youtube:player_client=android_vr,web_safari",
                   f"https://www.youtube.com/watch?v={vid}"]
              try:
                  z=subprocess.run(cmd,capture_output=True,text=True,timeout=45)
                  if z.returncode:
                      r["enrichError"]=z.stderr[-500:].replace("\n"," ")
                      continue
                  d=json.loads(z.stdout)
                  r["title"]=d.get("title") or r.get("title")
                  r["duration"]=d.get("duration") or r.get("duration")
                  r["thumbnail"]=d.get("thumbnail") or r.get("thumbnail")
                  r["uploadDate"]=d.get("upload_date") or r.get("uploadDate")
                  r["channel"]=d.get("channel") or r.get("channel")
                  heights=sorted({int(x["height"]) for x in d.get("formats",[]) if x.get("height")}, reverse=True)
                  r["maxResolution"]=heights[0] if heights else None
                  r["resolutions"]=heights
                  r["has2160p"]=2160 in heights
                  r["has1440p"]=1440 in heights
                  r["has1080p"]=1080 in heights
                  r.pop("enrichError",None)
              except Exception as e:
                  r["enrichError"]=str(e)
              if i%10==0:
                  p.write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
                  print(f"ENRICH {i}/{len(rows)}",flush=True)
          p.write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          ok=sum(1 for r in rows if not r.get("enrichError"))
          print(f"ENRICH_DONE={ok}/{len(rows)}")
          print("4K="+str(sum(bool(r.get("has2160p")) for r in rows)))
          PY
          python - <<'PY'
          import json,csv
          rows=json.load(open("youtube-khoai/catalog.json",encoding="utf-8"))
          fields=["videoId","title","url","duration","thumbnail","uploadDate","channel","maxResolution","has2160p","has1440p","has1080p"]
          with open("youtube-khoai/catalog.csv","w",newline="",encoding="utf-8-sig") as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction="ignore"); w.writeheader(); w.writerows(rows)
          PY
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-khoai/catalog.json youtube-khoai/catalog.csv
          git diff --cached --quiet || git commit -m "Update Khoai Lang Thang YouTube catalog"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: khoai-lang-thang-youtube-catalog
          path: youtube-khoai/
